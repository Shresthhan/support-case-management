services:
  db:
    image: postgres:16
    container_name: support-case-db

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: support_cases

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U postgres -d support_cases",
        ]
      interval: 5s
      timeout: 5s
      retries: 10


  api:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: support-case-api

    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/support_cases
      SECRET_KEY: replace-this-with-a-long-random-secret
      ACCESS_TOKEN_EXPIRE_MINUTES: 60

    depends_on:
      db:
        condition: service_healthy

    ports:
      - "8000:8000"

    command: >
      sh -c "
      alembic upgrade head &&
      python -m app.seed &&
      uvicorn app.main:app
      --host 0.0.0.0
      --port 8000
      "

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s


  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    container_name: support-case-frontend

    environment:
      API_BASE_URL: http://api:8000

    depends_on:
      api:
        condition: service_healthy

    ports:
      - "8501:8501"


volumes:
  postgres_data: